[package]
name = "lumaread"
version = "0.1.0"
description = "A focused local reading companion"
authors = ["LumaRead"]
edition = "2021"

[lib]
name = "lumaread_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.5.2", features = [] }

[dependencies]
tauri = { version = "=2.9.3", features = [] }
# Keep the runtime ABI aligned with the pinned Tauri 2.9.x WRY backend.
tauri-runtime = "=2.9.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt", "sync"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
